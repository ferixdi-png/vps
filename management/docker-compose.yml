services:
  api:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./api:/app:ro
      - ./data:/data
      - ../.env:/.env:ro
      - ../requirements.txt:/requirements.txt:ro
    command: sh -c "pip install --no-cache-dir -r /requirements.txt && python /app/app.py"

  bot:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./bot:/app:ro
      - ../.env:/.env:ro
      - ../requirements.txt:/requirements.txt:ro
    command: sh -c "pip install --no-cache-dir -r /requirements.txt && python /app/main.py"
    depends_on: [api]

  subscription:
    image: python:3.12-slim
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    volumes:
      - ./subscription:/app:ro
      - ./nodes.json:/config/nodes.json:ro
      - ./data:/data
      - ../.env:/.env:ro
      - ../requirements.txt:/requirements.txt:ro
    command: sh -c "pip install --no-cache-dir -r /requirements.txt && python /app/app.py"

  monitor:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./monitor:/app:ro
      - ./nodes.json:/config/nodes.json:ro
      - ./data:/data
      - ../.env:/.env:ro
      - ../requirements.txt:/requirements.txt:ro
    command: sh -c "pip install --no-cache-dir -r /requirements.txt && python /app/worker.py"
