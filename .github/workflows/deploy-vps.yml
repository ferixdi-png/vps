name: Deploy Ferixdi VPN Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'scripts/install-bot.sh'
      - '.github/workflows/deploy-vps.yml'

permissions:
  contents: read

concurrency:
  group: ferixdi-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 72.56.126.97
      VPS_USER: root
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SSHPASS" || { echo 'Missing VPS_PASSWORD secret'; exit 1; }
          test -n "$BOT_TOKEN" || { echo 'Missing BOT_TOKEN secret'; exit 1; }

      - name: Install SSH client
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Store bot token on VPS without printing it
        shell: bash
        run: |
          printf '%s\n' "$BOT_TOKEN" | sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$VPS_USER@$VPS_HOST" \
            'IFS= read -r token; umask 077; mkdir -p /opt/ferixdi; touch /opt/ferixdi/.env; chmod 600 /opt/ferixdi/.env; grep -v "^BOT_TOKEN=" /opt/ferixdi/.env > /opt/ferixdi/.env.tmp || true; printf "BOT_TOKEN=%s\n" "$token" >> /opt/ferixdi/.env.tmp; mv /opt/ferixdi/.env.tmp /opt/ferixdi/.env'

      - name: Store optional admin IDs
        if: ${{ env.ADMIN_IDS != '' }}
        shell: bash
        run: |
          printf '%s\n' "$ADMIN_IDS" | sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$VPS_USER@$VPS_HOST" \
            'IFS= read -r ids; grep -v "^ADMIN_IDS=" /opt/ferixdi/.env > /opt/ferixdi/.env.tmp || true; printf "ADMIN_IDS=%s\n" "$ids" >> /opt/ferixdi/.env.tmp; chmod 600 /opt/ferixdi/.env.tmp; mv /opt/ferixdi/.env.tmp /opt/ferixdi/.env'

      - name: Install or update bot
        shell: bash
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$VPS_USER@$VPS_HOST" \
            'curl -fsSL https://raw.githubusercontent.com/ferixdi-png/vps/main/scripts/install-bot.sh | bash'

      - name: Verify bot and VPN node
        shell: bash
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$VPS_USER@$VPS_HOST" \
            'systemctl is-active ferixdi-bot && docker ps --format "{{.Names}} {{.Status}}" | grep ferixdi-xray && curl -fsS http://127.0.0.1:8080/health'
