name: Deploy Ferixdi VPN Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'scripts/install-bot.sh'
      - 'scripts/setup-subscription-https.sh'
      - 'scripts/patch-bot-http-port.py'
      - 'scripts/patch-bot-runtime.py'
      - 'scripts/patch-bot-hardening.py'
      - 'scripts/patch-bot-profile-clean.py'
      - 'scripts/patch-bot-edge.py'
      - 'scripts/patch-bot-admin.py'
      - 'scripts/patch-bot-trial-day.py'
      - 'scripts/patch-bot-antispam.py'
      - 'scripts/patch-bot-admin-panel.py'
      - 'scripts/patch-bot-payment-ui.py'
      - 'scripts/patch-bot-referrals.py'
      - 'scripts/patch-bot-happ-simple.py'
      - 'scripts/repair-node-metadata.py'
      - 'scripts/expand-xray-inbounds.py'
      - 'scripts/ferixdi-healthcheck.sh'
      - '.github/workflows/deploy-vps.yml'

permissions:
  contents: read

concurrency:
  group: ferixdi-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, ferixdi-vps]
    timeout-minutes: 10
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$BOT_TOKEN" || { echo 'Missing BOT_TOKEN secret'; exit 1; }

      - name: Store secrets locally
        shell: bash
        run: |
          umask 077
          sudo mkdir -p /opt/ferixdi
          sudo touch /opt/ferixdi/.env
          sudo chmod 600 /opt/ferixdi/.env
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          sudo grep -v '^BOT_TOKEN=' /opt/ferixdi/.env | grep -v '^ADMIN_IDS=' > "$tmp" || true
          printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN" >> "$tmp"
          if [ -n "$ADMIN_IDS" ]; then
            printf 'ADMIN_IDS=%s\n' "$ADMIN_IDS" >> "$tmp"
          fi
          sudo install -m 600 "$tmp" /opt/ferixdi/.env

      - name: Install or update bot
        shell: bash
        run: |
          sudo touch /run/ferixdi-deploying
          trap 'sudo rm -f /run/ferixdi-deploying' EXIT
          sudo env DEPLOY_SHA="$GITHUB_SHA" bash "$GITHUB_WORKSPACE/scripts/install-bot.sh"

      - name: Verify bot and VPN node
        shell: bash
        run: |
          set -e
          sudo rm -f /run/ferixdi-deploying
          sudo docker ps --format '{{.Names}} {{.Status}}' | grep ferixdi-xray
          sudo systemctl is-enabled --quiet ferixdi-bot
          sudo systemctl is-enabled --quiet ferixdi-healthcheck.timer
          sudo systemctl is-active --quiet ferixdi-healthcheck.timer

          for i in $(seq 1 20); do
            if sudo systemctl is-active --quiet ferixdi-bot && curl -fsS http://127.0.0.1:8080/health; then
              echo
              echo 'FERIXDI BOT HEALTHY'
              break
            fi
            sleep 2
            if [ "$i" = 20 ]; then
              sudo systemctl --no-pager --full status ferixdi-bot || true
              sudo journalctl -u ferixdi-bot --no-pager -n 120 || true
              sudo ss -lntp | grep -E ':(8080|443|8443|12443|13443|17443)\b' || true
              exit 1
            fi
          done

          sudo grep -q '^TRIAL_DAYS=1$' /opt/ferixdi/.env
          grep -q '24 часа бесплатно' /opt/ferixdi/bot/main.py
          grep -q '24 часа теста закончились' /opt/ferixdi/bot/main.py
          grep -q 'Половина тестового дня уже прошла' /opt/ferixdi/bot/main.py
          grep -q 'Ferixdi VPN · Админ-панель' /opt/ferixdi/bot/main.py
          grep -q 'callback_data="adm_users"' /opt/ferixdi/bot/main.py
          grep -q 'callback_data="adm_expiring"' /opt/ferixdi/bot/main.py
          grep -q 'async def admin_extend_cb' /opt/ferixdi/bot/main.py
          grep -q 'async def admin_disable_cb' /opt/ferixdi/bot/main.py
          grep -q 'PAYMENT_PHONE.*89935801642' /opt/ferixdi/bot/main.py
          grep -q 'callback_data="pay_sent"' /opt/ferixdi/bot/main.py
          grep -q 'async def pay_approve' /opt/ferixdi/bot/main.py
          grep -q 'CopyTextButton' /opt/ferixdi/bot/main.py
          grep -q 'callback_data="admin_payments"' /opt/ferixdi/bot/main.py
          grep -q 'subscription_copy_keyboard' /opt/ferixdi/bot/main.py
          grep -q 'URL подписки' /opt/ferixdi/bot/main.py
          echo 'TRIAL + ADMIN + PAYMENT + HTTPS HAPP SUBSCRIPTION OK'

          PUBLIC_HOST="$(sudo awk -F= '$1=="PUBLIC_HOST" {print $2; exit}' /opt/ferixdi/.env)"
          PUBLIC_IP="$(sudo awk -F= '$1=="IP" {print $2; exit}' /root/FERIXDI-NODE-INFO.txt)"
          test -n "$PUBLIC_HOST" && test -n "$PUBLIC_IP"
          curl --resolve "${PUBLIC_HOST}:8080:${PUBLIC_IP}" -fsS "https://${PUBLIC_HOST}:8080/health" | grep -q '"ok": true'
          echo "PUBLIC HTTPS OK: https://${PUBLIC_HOST}:8080"

          sudo python3 -m json.tool /opt/ferixdi/node/xray-config.json >/dev/null
          sudo python3 - <<'PY'
          import json
          cfg=json.load(open('/opt/ferixdi/node/xray-config.json'))
          expected={443,8443,12443,13443,17443}
          expected_transport={443:'grpc',8443:'grpc',17443:'grpc',12443:'xhttp',13443:'xhttp'}
          expected_sid_counts={443:3,8443:2,17443:2,12443:3,13443:3}
          usable={}
          transports={}
          for inbound in cfg.get('inbounds', []):
              s=inbound.get('streamSettings', {})
              r=s.get('realitySettings', {})
              p=inbound.get('port')
              if inbound.get('protocol','vless') == 'vless' and p and r:
                  p=int(p)
                  usable[p] = len(r.get('shortIds') or [])
                  transports[p] = s.get('network')
          assert set(usable) == expected, f'unexpected live Reality ports: {usable}'
          assert usable == expected_sid_counts, f'unexpected shortId layout: {usable}'
          assert transports == expected_transport, f'unexpected transport layout: {transports}'
          print(f'XRAY ENDPOINTS OK: ports={sorted(usable)} transports={transports} shortIds={usable}')
          PY

          set +e
          sudo python3 - <<'PY'
          import base64, sqlite3, urllib.request
          from urllib.parse import urlsplit, parse_qs, unquote
          con = sqlite3.connect('/opt/ferixdi/data/bot.db')
          assert con.execute('PRAGMA quick_check').fetchone()[0] == 'ok'
          row = con.execute("SELECT sub_token FROM users WHERE enabled=1 ORDER BY created_at LIMIT 1").fetchone()
          if row:
              raw = urllib.request.urlopen(f'http://127.0.0.1:8080/sub/{row[0]}', timeout=5).read()
              decoded = base64.b64decode(raw, validate=True).decode()
              profiles = [x for x in decoded.splitlines() if x.startswith('vless://')]
              ports = {urlsplit(x).port for x in profiles}
              parsed = [(urlsplit(x).port, parse_qs(urlsplit(x).query), unquote(urlsplit(x).fragment)) for x in profiles]
              sids = [q.get('sid',[''])[0] for _,q,_ in parsed]
              assert len(profiles) == 8, f'expected 8 user-visible VLESS profiles, got {len(profiles)}'
              assert ports == {443,8443,12443,13443,17443}, f'unexpected subscription ports: {sorted(ports)}'
              assert len(set((p, sid) for (p,_,_), sid in zip(parsed, sids))) == 8, 'profiles are not unique'
              expected={443:'grpc',8443:'grpc',17443:'grpc',12443:'xhttp',13443:'xhttp'}
              for p,q,label in parsed:
                  assert q.get('security',[''])[0] == 'reality', f'{p}: security is not REALITY'
                  assert q.get('type',[''])[0] == expected[p], f'{p}: wrong client transport {q.get("type")}'
                  assert 'VLESS' in label and 'Reality' in label, f'{p}: unclear profile name: {label}'
              labels=[label for _,_,label in parsed]
              assert sum('если режут нестандартные порты' in x for x in labels) == 1, 'HTTPS-443 fallback must be unique'
              assert sum('если режут gRPC/HTTP2' in x for x in labels) == 1, 'anti-gRPC XHTTP profile must be unique'
              assert sum('запасной маршрут при DPI' in x for x in labels) == 1, 'DPI backup profile must be unique'
              assert all('#1' not in x and '#2' not in x for x in labels), f'duplicate-style labels remain: {labels}'
              print(f'SUBSCRIPTION OK: profiles={len(profiles)} clean_unique_profiles=8 fallbacks=3')
          PY
          audit_rc=$?
          set -e

          sudo /usr/local/sbin/ferixdi-healthcheck
          sysctl net.core.default_qdisc net.ipv4.tcp_congestion_control net.ipv4.tcp_mtu_probing net.ipv4.tcp_fastopen || true
          sudo journalctl -u ferixdi-bot --since '10 minutes ago' --no-pager | grep -Ei 'error|exception|failed|warning|subscription render|key callback|payment' || true
          if [ "$audit_rc" -ne 0 ]; then
            sudo journalctl -u ferixdi-bot --no-pager -n 100 || true
            exit "$audit_rc"
          fi
