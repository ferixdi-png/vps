name: Deploy Ferixdi VPN Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'scripts/**'
      - '.github/workflows/deploy-vps.yml'

permissions:
  contents: read

concurrency:
  group: ferixdi-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, ferixdi-vps]
    timeout-minutes: 10
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$BOT_TOKEN" || { echo 'Missing BOT_TOKEN secret'; exit 1; }

      - name: Store secrets locally
        shell: bash
        run: |
          umask 077
          sudo mkdir -p /opt/ferixdi
          sudo touch /opt/ferixdi/.env
          sudo chmod 600 /opt/ferixdi/.env
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          sudo grep -v '^BOT_TOKEN=' /opt/ferixdi/.env | grep -v '^ADMIN_IDS=' > "$tmp" || true
          printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN" >> "$tmp"
          if [ -n "$ADMIN_IDS" ]; then
            printf 'ADMIN_IDS=%s\n' "$ADMIN_IDS" >> "$tmp"
          fi
          sudo install -m 600 "$tmp" /opt/ferixdi/.env

      - name: Install or update bot
        shell: bash
        run: |
          sudo touch /run/ferixdi-deploying
          trap 'sudo rm -f /run/ferixdi-deploying' EXIT
          sudo env DEPLOY_SHA="$GITHUB_SHA" bash "$GITHUB_WORKSPACE/scripts/install-bot.sh"

      - name: Verify bot, HTTPS subscription and VPN profiles
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /run/ferixdi-deploying

          sudo docker ps --format '{{.Names}} {{.Status}}' | grep ferixdi-xray
          sudo systemctl is-enabled --quiet ferixdi-bot
          sudo systemctl is-enabled --quiet ferixdi-healthcheck.timer
          sudo systemctl is-active --quiet ferixdi-healthcheck.timer

          for i in $(seq 1 20); do
            if sudo systemctl is-active --quiet ferixdi-bot && curl -fsS http://127.0.0.1:8080/health; then
              echo
              echo 'FERIXDI BOT HEALTHY'
              break
            fi
            sleep 2
            if [ "$i" = 20 ]; then
              sudo systemctl --no-pager --full status ferixdi-bot || true
              sudo journalctl -u ferixdi-bot --no-pager -n 120 || true
              exit 1
            fi
          done

          sudo grep -q '^TRIAL_DAYS=1$' /opt/ferixdi/.env
          grep -q '24 часа бесплатно' /opt/ferixdi/bot/main.py
          grep -q 'callback_data="admin_payments"' /opt/ferixdi/bot/main.py
          grep -q 'subscription_copy_keyboard' /opt/ferixdi/bot/main.py
          grep -q 'Скопировать ключ' /opt/ferixdi/bot/main.py
          grep -q 'Вставить из буфера обмена' /opt/ferixdi/bot/main.py
          grep -q '#profile-title: FERIXDI CONNECT' /opt/ferixdi/bot/main.py
          if grep -q 'happ://add/' /opt/ferixdi/bot/main.py; then
            echo 'ERROR: obsolete happ:// wrapper is still present'
            exit 1
          fi

          PUBLIC_HOST="$(sudo awk -F= '$1=="PUBLIC_HOST" {print $2; exit}' /opt/ferixdi/.env)"
          PUBLIC_IP="$(sudo awk -F= '$1=="IP" {print $2; exit}' /root/FERIXDI-NODE-INFO.txt)"
          test -n "$PUBLIC_HOST" && test -n "$PUBLIC_IP"

          curl --resolve "${PUBLIC_HOST}:9443:${PUBLIC_IP}" -fsS "https://${PUBLIC_HOST}:9443/health" | grep -q '"ok": true'
          echo "PUBLIC HTTPS OK: https://${PUBLIC_HOST}:9443"

          sudo python3 -m json.tool /opt/ferixdi/node/xray-config.json >/dev/null
          sudo python3 - <<'PY'
          import json
          cfg=json.load(open('/opt/ferixdi/node/xray-config.json'))
          expected={443,8443,12443,13443,17443}
          expected_transport={443:'grpc',8443:'grpc',17443:'grpc',12443:'xhttp',13443:'xhttp'}
          expected_sid_counts={443:3,8443:2,17443:2,12443:3,13443:3}
          usable={}
          transports={}
          for inbound in cfg.get('inbounds', []):
              s=inbound.get('streamSettings', {})
              r=s.get('realitySettings', {})
              p=inbound.get('port')
              if inbound.get('protocol','vless') == 'vless' and p and r:
                  p=int(p)
                  usable[p]=len(r.get('shortIds') or [])
                  transports[p]=s.get('network')
          assert set(usable)==expected, f'unexpected live Reality ports: {usable}'
          assert usable==expected_sid_counts, f'unexpected shortId layout: {usable}'
          assert transports==expected_transport, f'unexpected transport layout: {transports}'
          print(f'XRAY ENDPOINTS OK: ports={sorted(usable)} transports={transports}')
          PY

          TOKEN="$(sudo python3 - <<'PY'
          import sqlite3
          from datetime import datetime, timezone
          con=sqlite3.connect('/opt/ferixdi/data/bot.db')
          rows=con.execute('SELECT sub_token, expires_at FROM users WHERE enabled=1 ORDER BY created_at').fetchall()
          now=datetime.now(timezone.utc)
          for token, exp in rows:
              try:
                  if exp and datetime.fromisoformat(exp) > now:
                      print(token)
                      break
              except Exception:
                  pass
          PY
          )"

          if [ -n "$TOKEN" ]; then
            tmp_sub="$(mktemp)"
            trap 'rm -f "$tmp_sub"' EXIT
            curl --resolve "${PUBLIC_HOST}:9443:${PUBLIC_IP}" -fsS "https://${PUBLIC_HOST}:9443/sub/${TOKEN}" -o "$tmp_sub"
            sudo python3 - "$tmp_sub" "$PUBLIC_IP" <<'PY'
          import pathlib, sys
          from urllib.parse import urlsplit, parse_qs, unquote

          text=pathlib.Path(sys.argv[1]).read_text()
          public_ip=sys.argv[2]
          lines=[x.strip() for x in text.splitlines() if x.strip()]
          assert lines and lines[0] == '#profile-title: FERIXDI CONNECT', f'bad subscription header: {lines[:2]}'
          profiles=[x for x in lines if x.startswith('vless://')]
          assert len(profiles)==8, f'expected 8 profiles, got {len(profiles)}'
          parsed=[(urlsplit(x).port, parse_qs(urlsplit(x).query), unquote(urlsplit(x).fragment), urlsplit(x).hostname) for x in profiles]
          assert {p for p,_,_,_ in parsed} == {443,8443,12443,13443,17443}
          expected={443:'grpc',8443:'grpc',17443:'grpc',12443:'xhttp',13443:'xhttp'}
          sids=[]
          for p,q,label,host in parsed:
              assert host == public_ip, f'{p}: expected raw IP {public_ip}, got {host}'
              assert q.get('security',[''])[0]=='reality', f'{p}: security mismatch'
              assert q.get('type',[''])[0]==expected[p], f'{p}: transport mismatch {q.get("type")}'
              assert 'VLESS' in label and 'Reality' in label, f'{p}: bad label {label}'
              sids.append((p,q.get('sid',[''])[0]))
          assert len(set(sids))==8, 'profiles are not unique'
          print(f'PUBLIC SUBSCRIPTION OK: plaintext=1 profiles={len(profiles)} raw_ip={public_ip}')
          PY
          else
            echo 'No active user available for public subscription content test'
          fi

          sudo /usr/local/sbin/ferixdi-healthcheck
          sysctl net.core.default_qdisc net.ipv4.tcp_congestion_control net.ipv4.tcp_mtu_probing net.ipv4.tcp_fastopen || true
