name: Validate
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python and shell files
        run: |
          python -m py_compile management/api/app.py management/api/db.py bot/main.py scripts/patch-bot-runtime.py scripts/patch-bot-hardening.py scripts/patch-bot-edge.py scripts/repair-node-metadata.py
          bash -n scripts/install-bot.sh
          bash -n scripts/ferixdi-healthcheck.sh
          bash -n scripts/generate-node-keys.sh
          bash -n scripts/generate-management-secrets.sh
