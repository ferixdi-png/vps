name: Validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile management/api/app.py management/api/db.py management/bot/main.py management/subscription/app.py management/monitor/worker.py
          python -m json.tool management/nodes.json >/dev/null
