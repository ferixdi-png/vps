name: Finalize manual payment flow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_manual_payment_admin_conflict.py'
      - '.github/workflows/apply-manual-payments.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Integrate payments with admin panel
        run: python scripts/fix_manual_payment_admin_conflict.py
      - name: Validate Python
        run: |
          python -m py_compile bot/main.py
          python -m py_compile scripts/patch-bot-admin-panel.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/main.py scripts/patch-bot-admin-panel.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Integrate manual payments with admin panel'
          git push
